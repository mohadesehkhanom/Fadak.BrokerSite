  server {
    
    listen 80;
    listen [::]:80;
    
    server_name ffg.ir www.ffg.ir;
    
    return 301 https://ffg.ir$request_uri;
  }
    
    
    server {
    
    listen 443 ssl;
    listen [::]:443 ssl;
    
    server_name www.ffg.ir;
    
    ssl_certificate /etc/letsencrypt/live/ffg.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ffg.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    return 301 https://ffg.ir$request_uri;
  }
    
    
    server {
    
    listen 443 ssl;
    listen [::]:443 ssl;
    
    server_name ffg.ir;
    
    root /var/www/fadak;
    index index.html;
    
    
    ssl_certificate /etc/letsencrypt/live/ffg.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ffg.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    
    location = /home {
    return 301 https://ffg.ir/;
  }
    
    location = /home/ {
    return 301 https://ffg.ir/;
  }
    
    
    rewrite ^/(.+)/$ /$1 permanent;
    
    
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|webp|avif|ttf|otf)$ {
    
    expires 30d;
    
    add_header Cache-Control "public, max-age=2592000, immutable";
    
    access_log off;
  }
    
    
    gzip on;
    
    gzip_vary on;
    
    gzip_proxied any;
    
    gzip_comp_level 6;
    
    gzip_min_length 1024;
    
    gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/ttf
    font/otf
    application/font-woff
    application/font-woff2;
    
    
    location ~* \.html$ {
    
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    
    expires 0;
  }
  
  location = /sitemap.xml {
    try_files $uri =404;
  }
  
  location = /robots.txt {
    try_files $uri =404;
  }
    
    location / {
      try_files $uri $uri.html /index.html;
    }
  
  }